<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clínica Salud Integral - Gestión de pacientes</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
  <div class="container"><span class="navbar-brand mb-0">Clínica Salud Integral - Gestión de pacientes</span></div>
</nav>
<div class="container my-4">
  <div id="mensajes"></div>

  <div class="card shadow-sm mb-4"><div class="card-body">
    <div class="input-group">
      <span class="input-group-text">Buscar por DNI o apellidos:</span>
      <input id="txtBuscar" class="form-control" type="text">
      <button class="btn btn-primary" onclick="filtrar('Buscar')">Buscar</button>
    </div>
  </div></div>
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <div class="row g-3"><div class="col-md-6"><label for="id_paciente" class="form-label fw-semibold">ID Paciente:</label><input id="id_paciente" class="form-control bg-light" readonly></div><div class="col-md-6"><label for="nombres" class="form-label fw-semibold">Nombres:</label><input id="nombres" type="text" class="form-control"></div><div class="col-md-6"><label for="apellidos" class="form-label fw-semibold">Apellidos:</label><input id="apellidos" type="text" class="form-control"></div><div class="col-md-6"><label for="dni" class="form-label fw-semibold">DNI:</label><input id="dni" type="text" class="form-control" maxlength="8"></div><div class="col-md-6"><label for="telefono" class="form-label fw-semibold">Teléfono:</label><input id="telefono" type="text" class="form-control"></div><div class="col-md-6"><label for="email" class="form-label fw-semibold">Email:</label><input id="email" type="email" class="form-control"></div><div class="col-md-6"><label for="fecha_de_nacimiento" class="form-label fw-semibold">Fecha de nacimiento:</label><input id="fecha_de_nacimiento" type="date" class="form-control"></div><div class="col-md-6"><label for="direccion" class="form-label fw-semibold">Dirección:</label><input id="direccion" type="text" class="form-control"></div></div>
      <div class="mt-4 d-flex gap-2 flex-wrap"><button class="btn btn-primary" onclick="ejecutar(0)">Registrar</button><button class="btn btn-primary" onclick="ejecutar(1)">Modificar</button><button class="btn btn-secondary" onclick="ejecutar(2)">Limpiar</button></div>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover table-striped mb-0">
        <thead class="table-dark"><tr><th>ID</th><th>DNI</th><th>Nombres</th><th>Apellidos</th><th>Teléfono</th><th>Email</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const CAMPOS = [{"k": "id_paciente", "l": "ID Paciente", "t": "auto", "r": false}, {"k": "nombres", "l": "Nombres", "t": "text", "r": true}, {"k": "apellidos", "l": "Apellidos", "t": "text", "r": true}, {"k": "dni", "l": "DNI", "t": "text", "p": "^[0-9]{8}$", "m": "El DNI debe tener 8 dígitos.", "r": true}, {"k": "telefono", "l": "Teléfono", "t": "text", "r": true}, {"k": "email", "l": "Email", "t": "email", "r": true}, {"k": "fecha_de_nacimiento", "l": "Fecha de nacimiento", "t": "date", "r": true}, {"k": "direccion", "l": "Dirección", "t": "text", "r": true}];
const COLUMNAS = [{"k": "id_paciente", "l": "ID"}, {"k": "dni", "l": "DNI"}, {"k": "nombres", "l": "Nombres"}, {"k": "apellidos", "l": "Apellidos"}, {"k": "telefono", "l": "Teléfono"}, {"k": "email", "l": "Email"}];
const BOTONES = [{"l": "Registrar", "a": "add"}, {"l": "Modificar", "a": "update"}, {"l": "Limpiar", "a": "clear"}];
const MODO = "crud";
const AUTOS = ["id_paciente"];
let datos = [{"_id": 1, "id_paciente": 1, "nombres": "Juan", "apellidos": "Pérez Rojas", "dni": "45871236", "telefono": "987654321", "email": "juan@mail.com", "fecha_de_nacimiento": "2026-10-10", "direccion": "Av. Lima 123"}, {"_id": 2, "id_paciente": 2, "nombres": "María", "apellidos": "Torres Díaz", "dni": "70234158", "telefono": "912345678", "email": "maria@mail.com", "fecha_de_nacimiento": "2026-10-11", "direccion": "Jr. Cusco 456"}, {"_id": 3, "id_paciente": 3, "nombres": "Luis", "apellidos": "Ramos Soto", "dni": "41256987", "telefono": "956321478", "email": "luis@mail.com", "fecha_de_nacimiento": "2026-10-12", "direccion": "Calle Sol 789"}];
let seleccionado = null;
let vista = datos;
let siguiente = datos.reduce((m, d) => Math.max(m, d._id), 0) + 1;

const $ = id => document.getElementById(id);
const hoy = () => new Date().toISOString().slice(0, 10);
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const H = { calcular(){}, validar(d,a){ return ''; }, limpiar(){}, linea(){} };

function calcular() { H.calcular(); }

function mensaje(texto, tipo) {
  $('mensajes').innerHTML =
    '<div class="alert alert-' + tipo + ' alert-dismissible fade show" role="alert">' + esc(texto) +
    '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
}

function valorInicial(c) {
  if (c.t === 'auto') return 'Automático';
  if (c.t === 'g' && c.h) return hoy();
  return '';
}

function pintarTabla(lista) {
  vista = lista;
  const tb = $('tbody');
  if (lista.length === 0) {
    tb.innerHTML = '<tr><td colspan="' + COLUMNAS.length + '" class="text-center text-muted">No se encontraron registros</td></tr>';
    return;
  }
  tb.innerHTML = lista.map(d =>
    '<tr style="cursor:pointer" class="' + (d._id === seleccionado ? 'table-primary' : '') + '" onclick="cargar(' + d._id + ')">' +
    COLUMNAS.map(c => '<td>' + esc(d[c.k] === undefined ? '' : d[c.k]) + '</td>').join('') + '</tr>'
  ).join('');
}

function limpiar() {
  seleccionado = null;
  CAMPOS.forEach(c => { $(c.k).value = valorInicial(c); });
  if ($('txtBuscar')) $('txtBuscar').value = '';
  H.limpiar();
  calcular();
  pintarTabla(datos);
}

function leerFormulario() {
  const d = {};
  CAMPOS.forEach(c => { if (c.t !== 'auto') d[c.k] = $(c.k).value.trim(); });
  CAMPOS.filter(c => c.h).forEach(c => { d[c.k] = hoy(); });
  return d;
}

function validar(d, accion) {
  for (const c of CAMPOS) {
    if (!c.r) continue;
    if (d[c.k] === '') return 'Complete el campo "' + c.l + '".';
    if (c.p && !new RegExp(c.p).test(d[c.k])) return c.m;
    if (c.t === 'number' && Number(d[c.k]) < 0) return 'El campo "' + c.l + '" no puede ser negativo.';
  }
  return H.validar(d, accion);
}

function guardar(modificar) {
  if (modificar && seleccionado === null) { mensaje('Primero seleccione un registro de la tabla.', 'warning'); return; }
  const d = leerFormulario();
  const error = validar(d, modificar ? 'update' : 'add');
  if (error) { mensaje(error, 'danger'); return; }
  if (modificar) {
    d._id = seleccionado;
    AUTOS.forEach(k => { d[k] = seleccionado; });
    datos = datos.map(x => x._id === seleccionado ? Object.assign({}, x, d) : x);
  } else {
    d._id = siguiente++;
    AUTOS.forEach(k => { d[k] = d._id; });
    COLUMNAS.forEach(c => { if (d[c.k] === undefined) d[c.k] = '—'; });
    datos.push(d);
  }
  limpiar();
  mensaje(modificar ? 'Registro modificado correctamente.' : 'Registro agregado correctamente.', 'success');
}

function cancelar() {
  if (seleccionado === null) { mensaje('Primero seleccione un registro de la tabla.', 'warning'); return; }
  if (!confirm('¿Seguro que desea cancelar este registro?')) return;
  const campo = CAMPOS.find(c => c.t === 'select' && /estado/i.test(c.l));
  const op = campo ? campo.o.find(o => /cancel/i.test(o)) : null;
  if (op) {
    datos = datos.map(x => x._id === seleccionado ? Object.assign({}, x, {[campo.k]: op}) : x);
  } else {
    datos = datos.filter(x => x._id !== seleccionado);
  }
  limpiar();
  mensaje('Registro cancelado correctamente.', 'success');
}

function filtrar(etiqueta) {
  const tb = $('txtBuscar');
  const t = tb ? tb.value.trim().toLowerCase() : '';
  let res = datos.filter(d => !t || COLUMNAS.some(c => String(d[c.k] === undefined ? '' : d[c.k]).toLowerCase().includes(t)));
  CAMPOS.forEach(c => {
    if (c.t === 'auto' || c.t === 'g' || c.t === 'area') return;
    const v = $(c.k).value.trim();
    if (!v || /^(todos|todas)$/i.test(v)) return;
    if (!COLUMNAS.some(x => x.k === c.k)) return;
    res = res.filter(d => String(d[c.k] === undefined ? '' : d[c.k]).toLowerCase().includes(v.toLowerCase()));
  });
  if (/vencimiento/i.test(etiqueta)) res = res.filter(d => d.estado === 'Vencido');
  if (/disponibilidad/i.test(etiqueta) && CAMPOS.some(c => c.k === 'disponibilidad' || (c.o && c.o.includes('Disponible'))))
    res = res.filter(d => d.estado === 'Disponible' || d.disponibilidad === 'Disponible');
  pintarTabla(res);
  mensaje(res.length ? 'Se encontraron ' + res.length + ' registro(s).' : 'No se encontraron resultados.', res.length ? 'success' : 'info');
}

function ejecutar(i) {
  const b = BOTONES[i];
  if (b.a === 'clear') limpiar();
  else if (b.a === 'filter') filtrar(b.l);
  else if (b.a === 'linea') H.linea();
  else if (b.a === 'add') guardar(false);
  else if (b.a === 'update') guardar(true);
  else if (b.a === 'upsert') guardar(seleccionado !== null);
  else if (b.a === 'cancel') cancelar();
}

function cargar(id) {
  if (MODO === 'consulta') return;
  const d = datos.find(x => x._id === id);
  if (!d) return;
  seleccionado = id;
  CAMPOS.forEach(c => { $(c.k).value = c.t === 'auto' ? d._id : (d[c.k] === undefined ? '' : d[c.k]); });
  calcular();
  pintarTabla(vista);
}

document.addEventListener('DOMContentLoaded', () => {
  CAMPOS.forEach(c => {
    $(c.k).addEventListener('input', calcular);
    $(c.k).addEventListener('change', calcular);
  });
  if ($('txtBuscar')) $('txtBuscar').addEventListener('keydown', e => { if (e.key === 'Enter') filtrar('Buscar'); });
  limpiar();
});
</script>
</body>
</html>
